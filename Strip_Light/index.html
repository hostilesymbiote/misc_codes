<!DOCTYPE html>
<html>
<head>
<title>RGB Strip Control</title>
<style>
body { font-family: sans-serif; background: #111; color: #eee; text-align: center; padding: 30px; }
input[type=range] { width: 80%; height: 30px; margin: 15px 0; }
.label { font-size: 20px; }
#preview { width: 120px; height: 120px; margin: 20px auto; border-radius: 50%; border: 3px solid #555; }
</style>
</head>
<body>

<h1>RGB Strip Control</h1>
<div id="preview"></div>

<div class="label" style="color:#ff5555">Red</div>
<input type="range" id="r" min="0" max="255" value="0">

<div class="label" style="color:#55ff55">Green</div>
<input type="range" id="g" min="0" max="255" value="0">

<div class="label" style="color:#5599ff">Blue</div>
<input type="range" id="b" min="0" max="255" value="0">

<script>
const r = document.getElementById('r');
const g = document.getElementById('g');
const b = document.getElementById('b');
const preview = document.getElementById('preview');

function updateColor() {
  preview.style.background = `rgb(${r.value}, ${g.value}, ${b.value})`;
}

function sendUpdate() {
  fetch(`/set?r=${r.value}&g=${g.value}&b=${b.value}`);
  updateColor();
}

r.addEventListener('input', sendUpdate);
g.addEventListener('input', sendUpdate);
b.addEventListener('input', sendUpdate);

updateColor();
</script>

</body>
</html>
